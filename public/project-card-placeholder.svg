<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Project preview placeholder">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1917"/>
      <stop offset="50%" stop-color="#161514"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>

    <radialGradient id="warmGlow" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#db1f18" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#db1f18" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#fff6e9" stroke-opacity="0.035" stroke-width="0.5"/>
    </pattern>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#fff6e9" fill-opacity="0.06"/>
    </pattern>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.075  0 0 0 0 0.068  0 0 0 0 0.058  0 0 0 0.28 0"/>
    </filter>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db1f18" stop-opacity="0"/>
      <stop offset="18%" stop-color="#db1f18" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#db1f18" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#db1f18" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base layers -->
  <rect width="600" height="800" fill="url(#surface)"/>
  <rect width="600" height="800" fill="url(#warmGlow)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <rect x="380" y="520" width="180" height="220" fill="url(#dots)" opacity="0.7"/>
  <rect width="600" height="800" filter="url(#grain)" opacity="0.45"/>
  <rect width="600" height="800" fill="url(#vignette)"/>

  <!-- Accent corner mark -->
  <path d="M 0 0 h 64 v 2 H 2 v 62 H 0 Z" fill="#db1f18" fill-opacity="0.88"/>
  <path d="M 0 0 h 2 v 64 H 0 Z" fill="#db1f18" fill-opacity="0.55"/>
  <line x1="64" y1="1" x2="108" y2="1" stroke="#db1f18" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="1" y1="64" x2="1" y2="108" stroke="#db1f18" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Abstract frame composition -->
  <g transform="translate(300 360)" opacity="0.9">
    <rect x="-148" y="-118" width="296" height="236" rx="6" fill="none" stroke="#fff6e9" stroke-opacity="0.12" stroke-width="1.25"/>
    <rect x="-118" y="-88" width="236" height="176" rx="4" fill="#fff6e9" fill-opacity="0.02" stroke="#fff6e9" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="-88" y1="-48" x2="88" y2="-48" stroke="#fff6e9" stroke-opacity="0.06" stroke-width="1"/>
    <line x1="-88" y1="-24" x2="56" y2="-24" stroke="#fff6e9" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="-88" y1="0" x2="72" y2="0" stroke="#fff6e9" stroke-opacity="0.05" stroke-width="1"/>
    <rect x="-72" y="24" width="52" height="20" rx="3" fill="#db1f18" fill-opacity="0.12" stroke="#db1f18" stroke-opacity="0.35" stroke-width="0.75"/>
    <rect x="-8" y="24" width="52" height="20" rx="3" fill="#fff6e9" fill-opacity="0.03" stroke="#fff6e9" stroke-opacity="0.1" stroke-width="0.75"/>
    <circle cx="98" cy="-68" r="3" fill="#db1f18" fill-opacity="0.5"/>
    <path d="M -132 -102 L -108 -78 M -108 -102 L -132 -78" stroke="#fff6e9" stroke-opacity="0.07" stroke-width="1"/>
    <path d="M 108 78 L 132 102 M 132 78 L 108 102" stroke="#fff6e9" stroke-opacity="0.07" stroke-width="1"/>
  </g>

  <!-- Geometric accent diamond -->
  <g transform="translate(300 360)" fill="none" stroke="#db1f18" stroke-opacity="0.18" stroke-width="1">
    <path d="M 0 -168 L 28 -140 L 0 -112 L -28 -140 Z"/>
    <path d="M 0 168 L 28 140 L 0 112 L -28 140 Z"/>
  </g>

  <!-- Horizontal accent rule -->
  <line x1="120" y1="640" x2="480" y2="640" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- Label -->
  <text
    x="300"
    y="688"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="0.42em"
    fill="#fff6e9"
    fill-opacity="0.28"
  >PROJECT</text>
</svg>
