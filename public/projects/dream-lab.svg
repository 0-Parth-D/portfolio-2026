<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Judged behavioral consistency of five student models</title>
  <text x="40" y="46" fill="#fff6e9" font-size="15" font-weight="700" letter-spacing="2.5">JUDGED BEHAVIORAL CONSISTENCY</text>
  <text x="40" y="70" fill="#fff6e9" fill-opacity="0.55" font-size="14">5 student models &#183; 32 scenarios &#183; all pass 100% of rule checks</text>

  <g stroke="#fff6e9" stroke-opacity="0.1" stroke-width="1">
    <line x1="230" y1="104" x2="230" y2="410"/>
    <line x1="357.5" y1="104" x2="357.5" y2="410" stroke-dasharray="3 5"/>
    <line x1="485" y1="104" x2="485" y2="410" stroke-dasharray="3 5"/>
    <line x1="612.5" y1="104" x2="612.5" y2="410" stroke-dasharray="3 5"/>
    <line x1="740" y1="104" x2="740" y2="410" stroke-dasharray="3 5"/>
  </g>
  <g fill="#fff6e9" fill-opacity="0.35" font-size="12" text-anchor="middle">
