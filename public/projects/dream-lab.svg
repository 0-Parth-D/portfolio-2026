    <text x="357.5" y="430">25%</text>
    <text x="485" y="430">50%</text>
    <text x="612.5" y="430">75%</text>
    <text x="740" y="430">100%</text>
  </g>

  <g font-size="14" text-anchor="end">
    <text x="214" y="140" fill="#fff6e9">Claude Sonnet 4.6</text>
    <text x="214" y="196" fill="#db1f18" font-weight="700">Llama 3.1 8B</text>
    <text x="214" y="213" fill="#db1f18" fill-opacity="0.8" font-size="11" letter-spacing="1">MY QLORA FINE-TUNE</text>
    <text x="214" y="264" fill="#fff6e9">GPT-5.4</text>
    <text x="214" y="326" fill="#fff6e9" fill-opacity="0.7">GPT-4o</text>
    <text x="214" y="388" fill="#fff6e9" fill-opacity="0.7">GPT-5.5</text>
  </g>

  <rect x="230" y="120" width="382.5" height="30" rx="3" fill="#fff6e9" fill-opacity="0.85"/>
  <rect x="230" y="182" width="379.95" height="30" rx="3" fill="#db1f18"/>
  <rect x="230" y="244" width="369.24" height="30" rx="3" fill="#fff6e9" fill-opacity="0.6"/>
  <rect x="230" y="306" width="276.42" height="30" rx="3" fill="#fff6e9" fill-opacity="0.25"/>
  <rect x="230" y="368" width="273.36" height="30" rx="3" fill="#fff6e9" fill-opacity="0.25"/>

  <g font-size="14" font-weight="700">
    <text x="623" y="140" fill="#fff6e9">75.0%</text>
    <text x="620" y="202" fill="#db1f18">74.5%</text>
    <text x="610" y="264" fill="#fff6e9">72.4%</text>
    <text x="517" y="326" fill="#fff6e9" fill-opacity="0.7">54.2%</text>
    <text x="514" y="388" fill="#fff6e9" fill-opacity="0.7">53.6%</text>
